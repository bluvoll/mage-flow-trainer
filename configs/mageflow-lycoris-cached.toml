[train]
cache_text_embeddings = true
caption_variations = 32
model_path = "mage-flow"
run_name = "mageflow-lycoris-cached"
attention_backend = "torch_varlen"
# pack_resolutions = true  # mix shapes; increase batch_size to at least 2
gradient_checkpointing = true
batch_size = 1
gradient_accumulation_steps = 4
max_text_tokens = 512
# checkpoint_blocks = [0, 2, 4, 6, 8, 10]
compile = "default"

[dataset]
path = "/path/to/images"
source = "latents"  # cache image latents first
resolution = 1024

[adapter]
kind = "lycoris_lora"
lycoris_algo = "locon"
rank = 32
alpha = 32
components = ["image_attn", "text_attn", "mlp"]

[quant]
mode = "frozen"
weights_dtype = "int8"
use_quantized_matmul = "auto"
quantize_text_encoder = true
skip_policy = "all_adaln"

[optimizer]
kind = "adamw"
lr = 1e-4

[flow]
shift = 6.0

[dataset.caption]
shuffle_tags = true
tag_dropout_percent = 0.1
caption_dropout_percent = 0.1
